global:
  scrape_interval: 15s


scrape_configs:
  - job_name: "cadvisor"
    static_configs:
      - targets: ["host.docker.internal:8082"]
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["host.docker.internal:9113"]
